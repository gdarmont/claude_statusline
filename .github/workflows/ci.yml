name: CI

# Lint and test every push to master and every pull request, and shellcheck the
# install scripts. The MSRV job builds with the rust-version from Cargo.toml, so
# the declared minimum stays true.
# release.yml also calls this workflow, so nothing ships without passing it.
# The weekly run catches lints from a new stable release before they block one.
on:
  push:
    branches: [master]
  pull_request:
  workflow_call:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Update stable toolchain
        run: rustup update stable --no-self-update && rustup component add rustfmt clippy

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Shell scripts
        run: shellcheck install.sh dev-install.sh uninstall.sh

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Update stable toolchain
        run: rustup update stable --no-self-update

      - name: Test
        run: cargo test --locked

      # /bin/bash, because that is what `curl | bash` runs: bash 3.2 on macOS
      - name: Uninstall script
        run: |
          dir=$(mktemp -d)
          touch "$dir/claude_statusline" "$dir/claude_subagent_statusline" "$dir/claude_statusline.update"
          printf '{"model": "opus", "statusLine": {"command": "%s/claude_statusline"},
            "subagentStatusLine": {"command": "~/.claude/claude_subagent_statusline"},
            "env": {"CLAUDE_STATUSLINE_UPDATE_CHECK": "0"}}' "$dir" >"$dir/settings.json"
          CLAUDE_DIR="$dir" CLAUDE_CONFIG_DIR="$dir" /bin/bash uninstall.sh
          [ "$(jq -c . "$dir/settings.json")" = '{"model":"opus"}' ]
          [ "$(ls "$dir" | tr '\n' ' ')" = 'settings.json settings.json.claude_statusline.bak ' ]

  msrv:
    name: test (MSRV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the declared minimum toolchain
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          # Validate before it reaches GITHUB_ENV
          if ! printf '%s' "$msrv" | grep -Eqx '[0-9]+\.[0-9]+(\.[0-9]+)?'; then
            echo "unexpected rust-version: '$msrv'" >&2
            exit 1
          fi
          rustup toolchain install "$msrv" --profile minimal --no-self-update
          echo "MSRV=$msrv" >> "$GITHUB_ENV"

      - name: Test
        run: cargo +"$MSRV" test --locked
