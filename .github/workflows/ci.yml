name: CI

# Lint and test every push to master and every pull request. The MSRV job
# builds with the rust-version from Cargo.toml, so the declared minimum stays true.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update stable toolchain
        run: rustup update stable --no-self-update && rustup component add rustfmt clippy

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Update stable toolchain
        run: rustup update stable --no-self-update

      - name: Test
        run: cargo test --locked

  msrv:
    name: test (MSRV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the declared minimum toolchain
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          # Validate before it reaches GITHUB_ENV
          if ! printf '%s' "$msrv" | grep -Eqx '[0-9]+\.[0-9]+(\.[0-9]+)?'; then
            echo "unexpected rust-version: '$msrv'" >&2
            exit 1
          fi
          rustup toolchain install "$msrv" --profile minimal --no-self-update
          echo "MSRV=$msrv" >> "$GITHUB_ENV"

      - name: Test
        run: cargo +"$MSRV" test --locked
