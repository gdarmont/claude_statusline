name: Release

# Tagging v* publishes a GitHub release with one zip per platform, each holding
# both binaries, plus a SHA256SUMS file that install.sh verifies against. The
# zips and binaries carry signed build provenance, for `gh attestation verify`.
#
# Running it by hand (workflow_dispatch) is a dry run: it tests, builds and
# packages every platform, then stops short of publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: ${{ matrix.label }}
    needs: ci
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # Sign and record the build provenance
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            label: x86_64-linux
          # GitHub's arm64 runner, free for public repositories: a native
          # build, so no cross toolchain
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            label: aarch64-linux
          - os: macos-latest
            target: aarch64-apple-darwin
            label: aarch64-macos
          # Cross-compiled from the arm64 runner: the Intel macOS runners are
          # being retired, and the Xcode toolchain links both slices anyway.
          - os: macos-latest
            target: x86_64-apple-darwin
            label: x86_64-macos

    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches Cargo.toml
        if: github.ref_type == 'tag'
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$crate" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $crate" >&2
            exit 1
          fi

      # The arm64 image hasn't always shipped Rust
      - name: Install rustup when missing
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --no-modify-path
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Install musl tools
        if: endsWith(matrix.target, '-linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          asset="claude_statusline-${GITHUB_REF_NAME}-${{ matrix.label }}.zip"
          zip -j "$asset" LICENSE \
            "target/${{ matrix.target }}/release/claude_statusline" \
            "target/${{ matrix.target }}/release/claude_subagent_statusline"
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      # The binaries too, so an installed copy verifies, not just the download
      - name: Attest build provenance
        if: github.ref_type == 'tag'
        uses: actions/attest@v4
        with:
          subject-path: |
            ${{ env.ASSET }}
            target/${{ matrix.target }}/release/claude_statusline
            target/${{ matrix.target }}/release/claude_subagent_statusline

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.label }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history and tags, for the commits since the previous release
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum *.zip | tee SHA256SUMS

      # --generate-notes lists pull requests, and commits land on master
      # directly, so list the commit subjects since the previous tag instead.
      # A dry run shows what it would publish in the job summary.
      - name: Release notes
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then from="$GITHUB_REF_NAME^"; else from=HEAD; fi
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$from" 2>/dev/null || true)
          {
            git log --no-merges --format='- %s' "${prev:+$prev..}HEAD" \
              | { grep -v '^- Release v[0-9]' || true; }
            echo
            echo "Install or update: [README](https://github.com/$GITHUB_REPOSITORY#install-or-update)"
            if [ -n "$prev" ]; then
              echo
              echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$prev...$GITHUB_REF_NAME"
            fi
          } | tee notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md
