name: Release

# Tagging v* publishes a GitHub release with one zip per platform, each holding
# both binaries, plus a SHA256SUMS file that install.sh verifies against.
#
# Running it by hand (workflow_dispatch) is a dry run: it tests, builds and
# packages every platform, then stops short of publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: ${{ matrix.label }}
    needs: ci
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            label: x86_64-linux
          - os: macos-latest
            target: aarch64-apple-darwin
            label: aarch64-macos
          # Cross-compiled from the arm64 runner: the Intel macOS runners are
          # being retired, and the Xcode toolchain links both slices anyway.
          - os: macos-latest
            target: x86_64-apple-darwin
            label: x86_64-macos

    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches Cargo.toml
        if: github.ref_type == 'tag'
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$crate" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $crate" >&2
            exit 1
          fi

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          asset="claude_statusline-${GITHUB_REF_NAME}-${{ matrix.label }}.zip"
          zip -j "$asset" \
            "target/${{ matrix.target }}/release/claude_statusline" \
            "target/${{ matrix.target }}/release/claude_subagent_statusline"
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.label }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum *.zip | tee SHA256SUMS

      - name: Create release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
